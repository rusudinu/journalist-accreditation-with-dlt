name: bac_web3
description: "BAC3.0 Wallet"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependency_overrides:
  pinenacl: 0.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.1
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  flutter_appauth: ^6.0.6
  http: ^1.2.1
  json_annotation: ^4.9.0
  fast_rsa: ^3.6.4
  logging: ^1.2.0
  uuid: ^4.5.0
  # used to generate mnemonic phrase
  bip39: ^1.0.6
  hex: ^0.2.0
  ed25519_hd_key: ^2.2.1
  web_socket_channel: ^3.0.1
  web3dart: ^2.7.3
  shared_preferences: ^2.3.2
  flutter_spinkit: ^5.2.1
  convert: ^3.1.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  file_picker: ^8.1.2
  path: ^1.9.0
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/CredentialManager.json
    - assets/png/
    - assets/svg/
